name: Daily Quote

on:
  schedule:
    # 02:30 UTC = 8:00 AM IST, every day
    - cron: "30 2 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "quotes.json"

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update quote of the day
        run: python3 scripts/daily_quote.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "Daily quote: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Quote already up to date."
          fi
