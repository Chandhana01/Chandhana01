<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nobel Atlas — Ultralearn Chemistry</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="src/styles.css" />
</head>
<body>
<div id="app">
  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">
      <span class="logo">⚗</span>
      <div class="brand-text">
        <h1>Nobel Atlas</h1>
        <p class="tagline">Ultralearn chemistry through every Nobel Prize, 1901&rarr;now</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="progress-pill" id="progressPill" title="Prizes you've added notes or flashcards to">
        <span id="progressFilled">0</span>/<span id="progressTotal">0</span> studied
      </div>
      <button class="btn" id="timelineBtn" title="Toggle timeline vs cluster layout">📅 Timeline</button>
      <button class="btn" id="trailsBtn" title="Guided learning paths in prerequisite order">🧭 Trails</button>
      <button class="btn" id="cardsBtn" title="All your flashcards in one place">🗂 Cards</button>
      <button class="btn" id="reviewBtn" title="Review flashcards due across all prizes">
        🎴 Review <span class="badge" id="dueBadge">0</span>
      </button>
      <button class="btn ghost" id="exportBtn" title="Export your notes &amp; flashcards">Export</button>
      <button class="btn ghost" id="importBtn" title="Import your notes &amp; flashcards">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden />
      <button class="btn ghost" id="themeBtn" title="Toggle light / dark">🌙</button>
      <button class="btn ghost" id="helpBtn" title="How to use this">?</button>
    </div>
  </header>

  <!-- Filter bar -->
  <div id="filterbar">
    <input type="search" id="searchBox" class="fb-search" placeholder="Search laureate, topic, tag…" autocomplete="off" />
    <div class="seg" id="engageSeg">
      <button data-engage="all" class="on">All</button>
      <button data-engage="studied">Studied</button>
      <button data-engage="empty">Not started</button>
      <button data-engage="due">Due</button>
    </div>
    <details class="dropdown" id="subDrop">
      <summary>Subfield</summary>
      <div class="dd-panel"><div class="dd-actions"><button class="mini-link" id="subAll">clear</button></div><div id="subfieldFilters" class="chk-list"></div></div>
    </details>
    <details class="dropdown" id="catDrop">
      <summary>Category</summary>
      <div class="dd-panel"><div class="dd-actions"><button class="mini-link" id="catAll">clear</button></div><div id="categoryFilters" class="chk-list"></div></div>
    </details>
    <button class="fb-btn" id="vibeToggle" aria-expanded="false">✨ Study by vibe</button>
    <span class="fb-spacer"></span>
    <button class="fb-btn ghost" id="clearAll" hidden>✕ clear filters</button>
  </div>

  <div id="main">
    <!-- Left: list of all prizes -->
    <aside id="sidePanel">
      <div class="sp-head">
        <span id="spCount">117 prizes</span>
        <select id="spSort" title="Sort the list">
          <option value="year-asc">Oldest first</option>
          <option value="year-desc">Newest first</option>
          <option value="subfield">By subfield</option>
          <option value="mastery">By my mastery</option>
        </select>
      </div>
      <div id="prizeList" class="prize-list"></div>
    </aside>

    <!-- Graph canvas -->
    <section id="graphWrap">
      <canvas id="graph"></canvas>
      <div id="graphHint" class="graph-hint">Click any node to enter its world →</div>
      <div class="graph-controls">
        <button class="btn ghost sm" id="zoomIn">+</button>
        <button class="btn ghost sm" id="zoomOut">−</button>
        <button class="btn ghost sm" id="zoomFit">fit</button>
      </div>
      <div id="hoverCard" class="hover-card" hidden></div>
    </section>

    <!-- Detail drawer -->
    <section id="detail" class="detail collapsed" aria-live="polite"></section>
  </div>
</div>

<!-- Study-by-vibe popover -->
<div id="vibePanel" class="vibe-pop" hidden></div>

<!-- Trail focus banner (shown on graph when a trail is active) -->
<div id="trailBanner" class="trail-banner" hidden></div>

<!-- Trails overlay -->
<div id="trailsOverlay" class="overlay" hidden></div>
<!-- Cards (global deck) overlay -->
<div id="cardsOverlay" class="overlay" hidden></div>
<!-- Learn mode (distraction-free) -->
<div id="learnMode" hidden></div>
<!-- Review overlay -->
<div id="reviewOverlay" class="overlay" hidden></div>
<!-- Help overlay -->
<div id="helpOverlay" class="overlay" hidden></div>

<script src="data/prizes.js"></script>
<script src="data/trails.js"></script>
<script src="src/store.js"></script>
<script src="src/graph.js"></script>
<script src="src/app.js"></script>
</body>
</html>
