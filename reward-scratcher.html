<title>Scratchwork</title>
<style>
  /* ============ whiteboard world — single committed theme ============ */
  :root {
    --board: #FBFBF9;
    --board-glare: rgba(215, 224, 232, 0.55);
    --marker: #E0392E;          /* red dry-erase marker */
    --marker-soft: rgba(224, 57, 46, 0.55);
    --marker-faint: rgba(224, 57, 46, 0.14);
    --pencil: #6B7280;          /* faint gray for meta text */
    --ink-dark: #3A3F47;
    --foil-a: #D9DCE1;          /* silver scratch foil */
    --foil-b: #AeB4BD;
    --good: #2E9E60;
    --focus: #2C5BD9;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      linear-gradient(118deg, transparent 30%, var(--board-glare) 42%, transparent 54%),
      linear-gradient(100deg, transparent 62%, rgba(220, 228, 236, 0.35) 74%, transparent 86%),
    var(--board);
    color: var(--marker);
    font-family: "Segoe Print", "Bradley Hand", "Chalkboard", "Marker Felt", "Comic Sans MS", cursive;
    font-size: 14px;
    line-height: 1.3;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, select { font: inherit; }
  :is(button, input, select, [tabindex]):focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* hand-drawn border trick */
  .sketchy {
    border: 2.5px solid var(--marker);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  }

  .wrap { max-width: 1020px; margin: 0 auto; padding: 14px 18px 20px; }

  /* ============ board rows ============ */
  .rows { display: flex; flex-direction: column; gap: 8px; }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(20px, 55px) 118px;
    gap: 0 6px;
    align-items: center;
  }
  @media (max-width: 720px) {
    .row { grid-template-columns: minmax(0, 1fr); }
    .row .connector { display: none; }
    .row .scratcher-cell { margin-top: 10px; justify-self: start; }
  }

  .task-cell { min-width: 0; }
  .owner {
    display: inline-block;
    color: var(--marker);
    opacity: 0.85;
    font-size: 0.85rem;
    transform: rotate(-1.5deg);
    margin-bottom: 2px;
  }
  .owner::after { content: " →"; }
  .task-title {
    margin: 0;
    font-size: 1.02rem;
    font-weight: 700;
    overflow-wrap: anywhere;
    transform: rotate(-0.4deg);
  }
  .task-title.struck { text-decoration: line-through wavy; opacity: 0.75; }

  /* day tally boxes */
  .days {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    margin-top: 3px;
  }
  .day-box {
    width: 30px;
    height: 31px;
    border: 2.5px solid var(--marker);
    border-radius: 12px 4px 14px 5px / 5px 14px 4px 12px;
    margin-right: -2.5px;
    background: transparent;
    display: grid;
    place-items: center;
    position: relative;
    font-size: 0.8rem;
    color: var(--marker-soft);
    padding: 0;
  }
  .day-box:nth-child(odd) { transform: rotate(0.8deg); }
  .day-box:nth-child(even) { transform: rotate(-0.7deg); }
  .day-box .n { position: absolute; top: 0px; right: 4px; font-size: 0.58rem; }
  .day-box .slash {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--marker);
    line-height: 1;
    transform: rotate(8deg);
  }
  .day-box.next { cursor: pointer; background: var(--marker-faint); }
  .day-box.next:hover .hint-plus { opacity: 1; }
  .day-box .hint-plus { font-size: 1.05rem; color: var(--marker); opacity: 0.5; }
  .day-box:disabled { cursor: default; }
  .day-box.next:disabled { cursor: pointer; } /* next box is a button, keep pointer */

  /* proof form */
  .proof-form { margin-top: 5px; max-width: 480px; }
  .proof-form .ask { margin: 0 0 2px; font-size: 0.9rem; }
  .proof-form .rule { color: var(--pencil); font-size: 0.72rem; font-family: system-ui, sans-serif; margin: 0 0 4px; }
  .proof-line { display: flex; gap: 8px; flex-wrap: wrap; }
  .proof-line input {
    flex: 1;
    min-width: 200px;
    border: 2px solid var(--marker-soft);
    border-radius: 10px 3px 12px 4px / 4px 12px 3px 10px;
    padding: 4px 8px;
    background: #fff;
    color: var(--ink-dark);
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
  }
  .proof-line input::placeholder { color: #9AA1AB; }

  .btn {
    background: transparent;
    border: 2.5px solid var(--marker);
    border-radius: 14px 5px 16px 6px / 6px 16px 5px 14px;
    padding: 3px 12px;
    font-weight: 700;
    font-size: 0.85rem;
  }
  .btn:hover { background: var(--marker-faint); }
  .btn.fill { background: var(--marker); color: #fff; }
  .btn.fill:hover { opacity: 0.9; }
  .btn.quiet {
    border-color: transparent;
    color: var(--pencil);
    font-size: 0.72rem;
    padding: 1px 6px;
  }
  .btn.quiet:hover { color: var(--marker); background: transparent; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .proof-log {
    margin: 2px 0 0;
    padding: 0;
    list-style: none;
    color: var(--pencil);
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.62rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0 12px;
  }
  .proof-log li { overflow-wrap: anywhere; }
  .proof-log .d { color: var(--good); font-weight: 700; margin-right: 6px; }

  /* dotted connector */
  .connector {
    height: 0;
    border-top: 3.5px dotted var(--marker);
    opacity: 0.75;
    transform: rotate(-2deg);
  }

  /* ============ scratcher card ============ */
  .scratcher-cell { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .scratcher {
    position: relative;
    width: 116px;
    height: 64px;
    border: 2.5px solid var(--marker);
    border-radius: 18px 6px 20px 8px / 8px 20px 6px 18px;
    overflow: hidden;
    background: #fff;
    transform: rotate(1.4deg);
  }
  .row:nth-child(even) .scratcher { transform: rotate(-1.6deg); }
  .scratcher .face {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 8px;
    background: #FFFDF5;
  }
  .scratcher .face .win {
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .scratcher .face .tiny {
    display: block;
    font-size: 0.52rem;
    color: var(--pencil);
    font-family: system-ui, sans-serif;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .scratcher canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
    transition: opacity 0.5s ease;
  }
  .scratcher canvas.gone { opacity: 0; pointer-events: none; }
  .scratcher .locked {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: repeating-linear-gradient(-45deg, #F4F5F3 0 10px, #FBFBF9 10px 20px);
    color: var(--pencil);
    font-size: 0.66rem;
    font-family: system-ui, sans-serif;
    text-align: center;
    padding: 6px;
  }
  .scratch-hint { font-size: 0.62rem; color: var(--pencil); font-family: system-ui, sans-serif; }
  .row-tools { display: flex; gap: 2px; }

  /* ============ add forms & pool ============ */
  .bench {
    margin-top: 16px;
    padding-top: 10px;
    border-top: 2.5px dashed var(--marker-soft);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 20px;
  }
  @media (max-width: 720px) { .bench { grid-template-columns: minmax(0, 1fr); } }
  .bench h2 {
    margin: 0 0 6px;
    font-size: 1.05rem;
    transform: rotate(-0.8deg);
  }

  .add-task-form { display: flex; flex-direction: column; gap: 6px; }
  .add-task-form .line { display: flex; gap: 8px; flex-wrap: wrap; }
  .add-task-form input, .add-task-form select {
    border: 2px solid var(--marker-soft);
    border-radius: 10px 3px 12px 4px / 4px 12px 3px 10px;
    padding: 4px 8px;
    background: #fff;
    color: var(--ink-dark);
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
  }
  .add-task-form input::placeholder { color: #9AA1AB; }
  .add-task-form .grow { flex: 1; min-width: 180px; }

  ul.pool { list-style: none; margin: 0 0 6px; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .pool li { display: flex; align-items: center; gap: 8px; }
  .pool .tick-mark { flex: none; font-size: 0.85rem; }
  .pool .pool-text { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 0.9rem; }
  .pool-line { display: flex; gap: 8px; flex-wrap: wrap; }
  .pool-line input {
    flex: 1;
    min-width: 180px;
    border: 2px solid var(--marker-soft);
    border-radius: 10px 3px 12px 4px / 4px 12px 3px 10px;
    padding: 4px 8px;
    background: #fff;
    color: var(--ink-dark);
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
  }
  .empty-note { color: var(--pencil); font-size: 0.85rem; font-family: system-ui, sans-serif; }

  /* ============ ledger ============ */
  .ledger { margin-top: 14px; }
  .ledger h2 { margin: 0 0 4px; font-size: 1.05rem; transform: rotate(-0.6deg); }
  ul.wins { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .wins li { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .wins .when { color: var(--pencil); font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.72rem; }
  .wins .what { font-weight: 700; overflow-wrap: anywhere; }
  .wins .for { color: var(--pencil); font-size: 0.8rem; font-family: system-ui, sans-serif; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="wrap">
  <div class="rows" id="rows"></div>
  <p class="empty-note" id="rows-empty" hidden>Board's empty — add your first task below.</p>

  <div class="bench">
    <section aria-labelledby="add-h">
      <h2 id="add-h">Add to the board</h2>
      <div class="add-task-form">
        <div class="line">
          <input class="grow" id="new-task" type="text" maxlength="120" placeholder="Task or habit (e.g. Workout 1h+)" aria-label="New task name" />
        </div>
        <div class="line">
          <input id="new-owner" type="text" maxlength="30" placeholder="Who? (optional)" aria-label="Owner (optional)" style="width: 130px;" />
          <select id="new-days" aria-label="How many times to complete">
            <option value="1">one-shot</option>
            <option value="3">3 days</option>
            <option value="5">5 days</option>
            <option value="7" selected>7 days in a row</option>
            <option value="10">10 days</option>
            <option value="14">14 days</option>
            <option value="21">21 days</option>
            <option value="30">30 days</option>
          </select>
          <button class="btn fill" id="add-task-btn">Add it</button>
        </div>
      </div>
    </section>

    <section aria-labelledby="pool-h">
      <h2 id="pool-h">Reward pool</h2>
      <ul class="pool" id="pool-list"></ul>
      <p class="empty-note" id="pool-empty" hidden>Pool's empty — add a treat so the scratchers have something to hide.</p>
      <div class="pool-line">
        <input id="new-reward" type="text" maxlength="120" placeholder="Add a reward…" aria-label="New reward" />
        <button class="btn" id="add-reward-btn">Add</button>
      </div>
    </section>
  </div>

  <section class="ledger" id="ledger" hidden aria-labelledby="ledger-h">
    <h2 id="ledger-h">Winnings so far ✓</h2>
    <ul class="wins" id="wins-list"></ul>
  </section>
</div>

<canvas id="confetti" hidden></canvas>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "scratchwork-v2";

  /* ---------------- state ---------------- */
  var state = {
    tasks: [
      mk("Egypt Article — publish", "", 1),
      mk("AM article — published", "", 1),
      mk("Workout 1h+ for 7 days in a row", "", 7),
      mk("Chem Immersion 7 days", "", 7),
      mk("No Youtube", "", 7),
      mk("Read 1h", "", 7)
    ],
    rewards: [
      "Gym membership",
      "Gym clothes",
      "Gym training session #1",
      "Gym training session #2",
      "Gym training session #3",
      "Gym training session #4"
    ],
    wins: []   // { reward, task, when }
  };

  function mk(text, owner, days) {
    return { id: uid(), text: text, owner: owner, days: days, checks: [], reward: null, revealed: false };
  }
  function uid() { return "t" + Math.random().toString(36).slice(2, 9); }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* in-memory only */ }
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      var s = JSON.parse(raw);
      if (s && Array.isArray(s.tasks) && Array.isArray(s.rewards)) state = s;
      state.tasks.forEach(function (t) {
        if (t.owner === "Coby" || t.owner === "Adam") t.owner = "";
      });
      /* swap old placeholder rewards for the real pool, keep user-added ones */
      var oldSeeds = ["Fancy dinner out", "One lazy Sunday, zero guilt", "New book of your choice", "Movie night + snacks", "Sleep in with no alarm"];
      state.rewards = state.rewards.filter(function (r) { return oldSeeds.indexOf(r) === -1; });
      ["Gym membership", "Gym clothes", "Gym training session #1", "Gym training session #2", "Gym training session #3", "Gym training session #4"].forEach(function (r) {
        if (state.rewards.indexOf(r) === -1) state.rewards.push(r);
      });
    } catch (e) { /* keep defaults */ }
  }

  var $ = function (id) { return document.getElementById(id); };
  var armingId = null;  // task currently showing its proof input

  function isComplete(t) { return t.checks.length >= t.days; }
  function isScratchable(t) { return t.reward !== null && !t.revealed; }

  /* assign hidden rewards to any newly-completed tasks */
  function assignRewards() {
    state.tasks.forEach(function (t) {
      if (isComplete(t) && t.reward === null && !t.revealed && state.rewards.length > 0) {
        t.reward = state.rewards[Math.floor(Math.random() * state.rewards.length)];
      }
    });
  }

  /* ---------------- render ---------------- */
  function render() {
    assignRewards();
    renderRows();
    renderPool();
    renderLedger();
    save();
    requestAnimationFrame(initAllFoils);
  }

  function renderRows() {
    var rows = $("rows");
    rows.textContent = "";
    $("rows-empty").hidden = state.tasks.length > 0;

    state.tasks.forEach(function (t) {
      var row = document.createElement("div");
      row.className = "row";

      /* ----- task cell ----- */
      var cell = document.createElement("div");
      cell.className = "task-cell";

      if (t.owner) {
        var ow = document.createElement("span");
        ow.className = "owner";
        ow.textContent = t.owner;
        cell.appendChild(ow);
      }

      var title = document.createElement("p");
      title.className = "task-title" + (isComplete(t) ? " struck" : "");
      title.textContent = t.text;
      cell.appendChild(title);

      /* day boxes */
      var days = document.createElement("div");
      days.className = "days";
      for (var i = 0; i < t.days; i++) {
        var filled = i < t.checks.length;
        var isNext = i === t.checks.length && !isComplete(t);
        var box = document.createElement("button");
        box.className = "day-box" + (isNext ? " next" : "");
        box.disabled = !isNext;
        if (t.days > 1) {
          var n = document.createElement("span");
          n.className = "n";
          n.setAttribute("aria-hidden", "true");
          n.textContent = i + 1;
          box.appendChild(n);
        }
        if (filled) {
          var s = document.createElement("span");
          s.className = "slash";
          s.setAttribute("aria-hidden", "true");
          s.textContent = "/";
          box.appendChild(s);
          box.setAttribute("aria-label", "Day " + (i + 1) + " done: " + t.checks[i].proof);
          box.title = t.checks[i].proof;
        } else if (isNext) {
          var plus = document.createElement("span");
          plus.className = "hint-plus";
          plus.setAttribute("aria-hidden", "true");
          plus.textContent = "+";
          box.appendChild(plus);
          box.setAttribute("aria-label", t.days > 1
            ? "Log day " + (i + 1) + " of " + t.days + " for: " + t.text
            : "Mark done: " + t.text);
          box.addEventListener("click", (function (task) {
            return function () {
              armingId = armingId === task.id ? null : task.id;
              render();
              if (armingId === task.id) {
                var inp = document.querySelector('[data-proof-for="' + task.id + '"]');
                if (inp) inp.focus();
              }
            };
          })(t));
        } else {
          box.setAttribute("aria-label", "Day " + (i + 1) + " — locked until earlier days are logged");
        }
        days.appendChild(box);
      }
      cell.appendChild(days);

      /* proof form — the required-input gate */
      if (armingId === t.id && !isComplete(t)) {
        var form = document.createElement("div");
        form.className = "proof-form";
        var ask = document.createElement("p");
        ask.className = "ask";
        ask.textContent = t.days > 1
          ? "Day " + (t.checks.length + 1) + " — what did you actually do?"
          : "Done? What did you actually do?";
        var rule = document.createElement("p");
        rule.className = "rule";
        rule.textContent = "Proof required — the box only fills once you write something.";
        var line = document.createElement("div");
        line.className = "proof-line";
        var inp = document.createElement("input");
        inp.type = "text";
        inp.maxLength = 200;
        inp.placeholder = "e.g. “45 min run + 20 min weights”";
        inp.setAttribute("data-proof-for", t.id);
        inp.setAttribute("aria-label", "Proof for: " + t.text);
        var logBtn = document.createElement("button");
        logBtn.className = "btn fill";
        logBtn.textContent = "Log it";
        logBtn.disabled = true;
        inp.addEventListener("input", function () {
          logBtn.disabled = inp.value.trim().length === 0;
        });
        var commit = (function (task, input) {
          return function () {
            var v = input.value.trim();
            if (!v) return;              /* hard gate: no proof, no tally */
            task.checks.push({ proof: v });
            armingId = null;
            render();
          };
        })(t, inp);
        logBtn.addEventListener("click", commit);
        inp.addEventListener("keydown", function (e) { if (e.key === "Enter") commit(); });
        var cancel = document.createElement("button");
        cancel.className = "btn quiet";
        cancel.textContent = "cancel";
        cancel.addEventListener("click", function () { armingId = null; render(); });
        line.appendChild(inp);
        line.appendChild(logBtn);
        line.appendChild(cancel);
        form.appendChild(ask);
        form.appendChild(rule);
        form.appendChild(line);
        cell.appendChild(form);
      }

      /* proof log under multi-day tasks */
      if (t.checks.length > 0) {
        var logList = document.createElement("ul");
        logList.className = "proof-log";
        t.checks.forEach(function (c, idx) {
          var li = document.createElement("li");
          var d = document.createElement("span");
          d.className = "d";
          d.textContent = t.days > 1 ? "d" + (idx + 1) : "✓";
          li.appendChild(d);
          li.appendChild(document.createTextNode(c.proof));
          logList.appendChild(li);
        });
        cell.appendChild(logList);
      }

      /* tools: undo last / remove */
      var tools = document.createElement("div");
      tools.className = "row-tools";
      if (t.checks.length > 0 && t.reward === null && !t.revealed) {
        var undo = document.createElement("button");
        undo.className = "btn quiet";
        undo.textContent = "undo last";
        undo.addEventListener("click", function () { t.checks.pop(); render(); });
        tools.appendChild(undo);
      }
      if (t.revealed) {
        var again = document.createElement("button");
        again.className = "btn quiet";
        again.textContent = "run it back ↻";
        again.addEventListener("click", function () {
          t.checks = [];
          t.reward = null;
          t.revealed = false;
          render();
        });
        tools.appendChild(again);
      }
      var del = document.createElement("button");
      del.className = "btn quiet";
      del.setAttribute("aria-label", "Erase task: " + t.text);
      del.textContent = "erase ✕";
      del.addEventListener("click", function () {
        state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; });
        if (armingId === t.id) armingId = null;
        render();
      });
      tools.appendChild(del);
      cell.appendChild(tools);

      /* ----- connector ----- */
      var conn = document.createElement("div");
      conn.className = "connector";
      conn.setAttribute("aria-hidden", "true");

      /* ----- scratcher ----- */
      var sCell = document.createElement("div");
      sCell.className = "scratcher-cell";
      var card = document.createElement("div");
      card.className = "scratcher";

      var face = document.createElement("div");
      face.className = "face";
      var faceInner = document.createElement("div");
      var tiny = document.createElement("span");
      tiny.className = "tiny";
      tiny.textContent = "You won";
      var win = document.createElement("div");
      win.className = "win";
      win.textContent = t.reward || "";
      faceInner.appendChild(tiny);
      faceInner.appendChild(win);
      face.appendChild(faceInner);
      card.appendChild(face);

      var hint = document.createElement("span");
      hint.className = "scratch-hint";

      if (t.revealed) {
        hint.textContent = "revealed ✓";
      } else if (isScratchable(t)) {
        var cv = document.createElement("canvas");
        cv.setAttribute("data-foil-for", t.id);
        cv.setAttribute("aria-label", "Scratch to reveal your reward for: " + t.text);
        card.appendChild(cv);
        attachScratch(cv, t);
        hint.textContent = "scratch me!";
        var tear = document.createElement("button");
        tear.className = "btn quiet";
        tear.textContent = "tear open";
        tear.addEventListener("click", function () { reveal(t); });
        sCell.appendChild(card);
        sCell.appendChild(hint);
        sCell.appendChild(tear);
        row.appendChild(cell);
        row.appendChild(conn);
        row.appendChild(sCell);
        $("rows").appendChild(row);
        return;
      } else {
        var lock = document.createElement("div");
        lock.className = "locked";
        var left = t.days - t.checks.length;
        if (isComplete(t) && state.rewards.length === 0) {
          lock.textContent = "add a reward to the pool to unlock";
        } else if (t.days > 1) {
          lock.textContent = left + " of " + t.days + " to go";
        } else {
          lock.textContent = "locked until done";
        }
        card.appendChild(lock);
        hint.textContent = t.days > 1 ? "finish the streak" : "finish the task";
      }

      sCell.appendChild(card);
      sCell.appendChild(hint);

      row.appendChild(cell);
      row.appendChild(conn);
      row.appendChild(sCell);
      $("rows").appendChild(row);
    });
  }

  function renderPool() {
    var list = $("pool-list");
    list.textContent = "";
    $("pool-empty").hidden = state.rewards.length > 0;
    state.rewards.forEach(function (r, i) {
      var li = document.createElement("li");
      var tick = document.createElement("span");
      tick.className = "tick-mark";
      tick.setAttribute("aria-hidden", "true");
      tick.textContent = "→";
      var txt = document.createElement("span");
      txt.className = "pool-text";
      txt.textContent = r;
      var del = document.createElement("button");
      del.className = "btn quiet";
      del.setAttribute("aria-label", "Remove reward: " + r);
      del.textContent = "✕";
      del.addEventListener("click", function () {
        state.rewards.splice(i, 1);
        render();
      });
      li.appendChild(tick);
      li.appendChild(txt);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  function renderLedger() {
    $("ledger").hidden = state.wins.length === 0;
    var list = $("wins-list");
    list.textContent = "";
    state.wins.slice().reverse().forEach(function (w) {
      var li = document.createElement("li");
      var when = document.createElement("span");
      when.className = "when";
      when.textContent = w.when;
      var what = document.createElement("span");
      what.className = "what";
      what.textContent = w.reward;
      var f = document.createElement("span");
      f.className = "for";
      f.textContent = "— for “" + w.task + "”";
      li.appendChild(when);
      li.appendChild(what);
      li.appendChild(f);
      list.appendChild(li);
    });
  }

  /* ---------------- scratch foil ---------------- */
  function initAllFoils() {
    document.querySelectorAll("canvas[data-foil-for]").forEach(function (cv) {
      if (cv.getAttribute("data-foiled") === "1") return;
      drawFoil(cv);
      cv.setAttribute("data-foiled", "1");
    });
  }

  function drawFoil(canvas) {
    var w = canvas.clientWidth || canvas.parentElement.clientWidth;
    var h = canvas.clientHeight || canvas.parentElement.clientHeight;
    if (!w || !h) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    /* silver foil */
    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#DDE0E5");
    g.addColorStop(0.5, "#B9BEC7");
    g.addColorStop(1, "#D6D9DE");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 90; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? "rgba(255,255,255,0.5)" : "rgba(90,96,105,0.25)";
      ctx.fillRect(Math.random() * w, Math.random() * h, 1.4, 1.4);
    }

    /* red marker scribble, like the whiteboard sketch */
    ctx.strokeStyle = "rgba(224, 57, 46, 0.85)";
    ctx.lineWidth = 3.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    var x = w * 0.12, y = h * 0.7;
    ctx.moveTo(x, y);
    var zig = 5 + Math.floor(Math.random() * 3);
    for (var z = 0; z < zig; z++) {
      x += (w * 0.72) / zig;
      y = z % 2 === 0 ? h * (0.2 + Math.random() * 0.12) : h * (0.68 + Math.random() * 0.12);
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function attachScratch(canvas, task) {
    var scratching = false;
    var lastPt = null;
    var moves = 0;

    function erase(x, y) {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var ctx = canvas.getContext("2d");
      ctx.save();
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineWidth = 26;
      ctx.lineCap = "round";
      ctx.beginPath();
      if (lastPt) {
        ctx.moveTo(lastPt.x, lastPt.y);
        ctx.lineTo(x, y);
        ctx.stroke();
      } else {
        ctx.arc(x, y, 13, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
      lastPt = { x: x, y: y };
    }

    function pct() {
      var ctx = canvas.getContext("2d");
      var data;
      try { data = ctx.getImageData(0, 0, canvas.width, canvas.height).data; }
      catch (e) { return 0; }
      var clear = 0, total = 0, step = 5;
      for (var y = 0; y < canvas.height; y += step) {
        for (var x = 0; x < canvas.width; x += step) {
          total++;
          if (data[(y * canvas.width + x) * 4 + 3] < 40) clear++;
        }
      }
      return total ? (clear / total) * 100 : 0;
    }

    function finishCheck() {
      if (pct() > 55) {
        canvas.classList.add("gone");
        reveal(task);
      }
    }

    canvas.addEventListener("pointerdown", function (e) {
      if (task.revealed) return;
      scratching = true;
      lastPt = null;
      canvas.setPointerCapture(e.pointerId);
      var r = canvas.getBoundingClientRect();
      erase(e.clientX - r.left, e.clientY - r.top);
    });
    canvas.addEventListener("pointermove", function (e) {
      if (!scratching) return;
      var r = canvas.getBoundingClientRect();
      erase(e.clientX - r.left, e.clientY - r.top);
      moves++;
      if (moves % 18 === 0) finishCheck();
    });
    function up() {
      if (!scratching) return;
      scratching = false;
      lastPt = null;
      finishCheck();
    }
    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointercancel", up);
  }

  function reveal(task) {
    if (task.revealed || task.reward === null) return;
    task.revealed = true;
    state.wins.push({
      reward: task.reward,
      task: task.text,
      when: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" })
    });
    render();
    burstConfetti();
  }

  /* ---------------- add task / reward ---------------- */
  function addTask() {
    var name = $("new-task").value.trim();
    if (!name) return;
    var owner = $("new-owner").value.trim();
    var days = parseInt($("new-days").value, 10) || 1;
    state.tasks.push(mk(name, owner, days));
    $("new-task").value = "";
    $("new-owner").value = "";
    render();
    $("new-task").focus();
  }
  $("add-task-btn").addEventListener("click", addTask);
  $("new-task").addEventListener("keydown", function (e) { if (e.key === "Enter") addTask(); });

  function addReward() {
    var inp = $("new-reward");
    var v = inp.value.trim();
    if (!v) return;
    state.rewards.push(v);
    inp.value = "";
    render();   /* re-runs assignRewards for tasks waiting on an empty pool */
    inp.focus();
  }
  $("add-reward-btn").addEventListener("click", addReward);
  $("new-reward").addEventListener("keydown", function (e) { if (e.key === "Enter") addReward(); });

  /* ---------------- confetti ---------------- */
  function burstConfetti() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var canvas = $("confetti");
    canvas.hidden = false;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var W = window.innerWidth, H = window.innerHeight;
    var colors = ["#E0392E", "#F2A93B", "#2E9E60", "#2C5BD9", "#E86A5E"];
    var parts = [];
    for (var i = 0; i < 110; i++) {
      parts.push({
        x: W / 2 + (Math.random() - 0.5) * 140,
        y: H * 0.4,
        vx: (Math.random() - 0.5) * 10,
        vy: -Math.random() * 10 - 3,
        s: Math.random() * 7 + 4,
        c: colors[i % colors.length],
        r: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.25
      });
    }
    var frames = 0;
    (function tick() {
      frames++;
      ctx.clearRect(0, 0, W, H);
      parts.forEach(function (p) {
        p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * 0.6);
        ctx.restore();
      });
      if (frames < 150) requestAnimationFrame(tick);
      else { ctx.clearRect(0, 0, W, H); canvas.hidden = true; }
    })();
  }

  /* ---------------- boot ---------------- */
  load();
  render();
})();
</script>
